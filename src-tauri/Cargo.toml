[package]
name = "scan-lun"
version = "1.0.8"
description = "A minimal daily self-reflection tool. Popup three preset questions on schedule, run in background tray, store records locally."
authors = ["xianglun918"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scan_lun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4.45"
tokio = { version = "1.53.1", features = ["time", "macros"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"

# Faster dev iteration: compile dependencies with light optimization so the app
# runs snappily under `tauri dev`, while the workspace crate still rebuilds cheap.
[profile.dev]
opt-level = 1

