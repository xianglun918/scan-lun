name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tagName:
        description: "Tag to release (defaults to latest v* tag)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tagName || github.ref_name }}
          releaseName: "scan-lun ${{ github.event.inputs.tagName || github.ref_name }}"
          releaseBody: |
            参见各平台安装包。
          releaseDraft: true
          prerelease: false
          # tauri-action 的自动 latest.json 生成有竞态 + 漏传 updater bundle，
          # 改由独立的 publish-release-metadata job 统一生成。
          uploadUpdaterJson: 'false'
          uploadUpdaterSignatures: 'true'
          args: ${{ matrix.args }}

  publish-release-metadata:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and upload latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-latest-json.mjs "${{ github.event.inputs.tagName || github.ref_name }}" "参见各平台安装包。"
      - name: Generate and upload SHA256SUMS
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-sha256sums.mjs "${{ github.event.inputs.tagName || github.ref_name }}"

  # Final gate: verify latest.json covers all platforms with valid signatures
  # and SHA256SUMS exists, THEN flip the draft to published. A broken updater
  # can never reach users this way (failures are cleaned up below).
  publish-github-release:
    needs: publish-release-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify assets then publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release.mjs "${{ github.event.inputs.tagName || github.ref_name }}"

  # pi-style safety net: any failure above → delete the draft release (tag is
  # kept; recover via workflow_dispatch, do NOT re-run scripts/release.mjs).
  cleanup-draft-github-release:
    needs: [build-and-release, publish-release-metadata, publish-github-release]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete draft release if present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tagName || github.ref_name }}"
          if gh release view "$TAG" --json isDraft --jq .isDraft | grep -q true; then
            gh release delete "$TAG" --yes
            echo "::warning::draft release $TAG deleted after failed run; tag kept — recover via workflow_dispatch"
          else
            echo "no draft release to clean"
          fi
