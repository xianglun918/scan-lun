name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "scan-lun ${{ github.ref_name }}"
          releaseBody: |
            参见各平台安装包。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # WORKAROUND: tauri-action v0/v1 has a bug — buildProject() filters
      # artifacts with existsSync() before .zip/.sig files are generated, so
      # latest.json never gets uploaded. We generate + upload it ourselves.
      # Each platform job merges its own entries into the release's latest.json.
      - name: Upload updater JSON (latest.json)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_DIR: src-tauri/target/${{ matrix.platform == 'macos-latest' && 'universal-apple-darwin/release' || 'release' }}/bundle
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # map runner platform -> updater platform/arch
          if [ "$PLATFORM" = "macos-latest" ]; then
            UPD_PLATFORM=darwin
            UPD_ARCH=universal
          elif [ "$PLATFORM" = "ubuntu-22.04" ]; then
            UPD_PLATFORM=linux
            UPD_ARCH=x86_64
          else
            UPD_PLATFORM=windows
            UPD_ARCH=x86_64
          fi
          echo "== bundle dir =="; find "$BUNDLE_DIR" -type f | sort || true
          node scripts/build-latest-json.mjs \
            --platform "$UPD_PLATFORM" \
            --arch "$UPD_ARCH" \
            --tag "${{ github.ref_name }}" \
            --bundle-dir "$BUNDLE_DIR" \
            --notes "参见各平台安装包。"
