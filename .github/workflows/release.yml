name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tagName:
        description: "Tag to release (defaults to latest v* tag)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tagName || github.ref_name }}
          releaseName: "scan-lun ${{ github.event.inputs.tagName || github.ref_name }}"
          releaseBody: |
            参见各平台安装包。
          releaseDraft: true
          prerelease: false
          # tauri-action 的自动 latest.json 生成有竞态 + 漏传 updater bundle，
          # 改由独立的 publish-updater-json job 统一生成。
          uploadUpdaterJson: 'false'
          uploadUpdaterSignatures: 'true'
          args: ${{ matrix.args }}

      # tauri-action 只上传 macOS 的 updater bundle，漏掉 Windows/Linux 的
      # .zip/.tar.gz。这里手动补传它们（含 .sig），供后续统一生成 latest.json。
      - name: Upload updater bundles (.zip/.tar.gz + .sig)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_DIR: src-tauri/target/${{ matrix.platform == 'macos-latest' && 'universal-apple-darwin/release' || 'release' }}/bundle
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for f in "$BUNDLE_DIR"/**/*.zip "$BUNDLE_DIR"/**/*.zip.sig "$BUNDLE_DIR"/**/*.tar.gz "$BUNDLE_DIR"/**/*.tar.gz.sig; do
            [ -f "$f" ] || continue
            echo "uploading $f"
            gh release upload "${{ github.event.inputs.tagName || github.ref_name }}" "$f" --clobber
          done

  publish-updater-json:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and upload latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-latest-json.mjs "${{ github.event.inputs.tagName || github.ref_name }}" "参见各平台安装包。"
